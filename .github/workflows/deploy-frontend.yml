name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'packages/frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspace=packages/frontend --include-workspace-root

      - name: Build
        env:
          # Repo name is derived automatically; override if using a custom domain (set VITE_BASE_PATH="/").
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Set VITE_API_BASE_URL in repo Settings > Secrets and variables > Actions
          # to your deployed backend URL (e.g. https://halalornot-backend.onrender.com)
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build --workspace=packages/frontend

      - name: Add SPA fallback for client-side routing
        run: cp packages/frontend/dist/index.html packages/frontend/dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
